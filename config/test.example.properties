# TestLab Shop – cvičenie 05
# Súbor sa číta ako UTF-8. Hodnoty nevkladajte do úvodzoviek.
# Skopírujte ho ako config/test.properties a nahraďte všetky SEM_* hodnoty.

# Adresa WEBOVEJ aplikácie, nie /api/index.php.
base.url=http://127.0.0.1:8080/

# Účet jedného čerstvého izolovaného run-* priestoru:
# v PHP projekte: php bin/fixtures.php create
test.workspace=SEM_RUN_WORKSPACE
test.email=SEM_FIXTURE_EMAIL
test.password=SEM_FIXTURE_PASSWORD

browser=chrome
headless=false
timeout.seconds=30

# Pri zlyhaní po vytvorení objednávky sa test pokúsi cez GUI zrušiť IBA vlastné UUID.
cleanup.order=true

# Voliteľné absolútne cesty. Prázdna hodnota = Selenium Manager / bežná inštalácia.
# Vo Windows používajte / alebo escapované \\.
driver.path=
browser.binary=

# Read-only JDBC účet. Nepoužívajte root ani aplikačný účet.
db.url=jdbc:mariadb://127.0.0.1:3306/testlab_shop?connectTimeout=5000&socketTimeout=10000
db.user=testlab_reader
db.password=SEM_DB_READER_PASSWORD

# Kontrola SHOW GRANTS odmietne zjavné zapisovacie oprávnenia.
db.verify.readonly=true
